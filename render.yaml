databases:
  - name: agrosmart-db
    databaseName: agrosmart
    user: agrosmart_user
    plan: free

services:
  # 1. Python Flask AI Microservice
  - type: web
    name: agrosmart-ai
    runtime: python
    rootDir: ai
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn -c gunicorn_config.py api.app:app"
    plan: starter
    envVars:
      - key: PORT
        value: 10000
      - key: GUNICORN_WORKERS
        value: 1

  # 2. Node.js Express Backend
  - type: web
    name: agrosmart-backend
    runtime: node
    rootDir: server
    buildCommand: "npm install --production"
    startCommand: "npm start"
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrosmart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_SERVER_URL
        fromService:
          type: web
          name: agrosmart-ai
          property: host
      - key: FLASK_AI_URL
        fromService:
          type: web
          name: agrosmart-ai
          property: host

  # 3. React Vite Frontend
  - type: web
    name: agrosmart-frontend
    runtime: static
    rootDir: client
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agrosmart-backend
          property: host
          path: /api
