version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: agrosmart_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-agrosmart}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agrosmart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: agrosmart_ai
    restart: always
    environment:
      PORT: 5001
      GUNICORN_WORKERS: 1
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agrosmart_backend
    restart: always
    environment:
      PORT: 5002
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/${DB_NAME:-agrosmart}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_key_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_SERVER_URL: http://ai:5001
      FLASK_AI_URL: http://ai:5001
    ports:
      - "5002:5002"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: agrosmart_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
